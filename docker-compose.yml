# Lingkungan lokal PT FitZone Nusantara (versi ringan untuk RAM 12 GB)
# Isi: 1 PostgreSQL (data warehouse + metadata Airflow), Airflow webserver + scheduler (LocalExecutor)
# Data Lake: folder ./data_lake (raw dan curated), dipasang ke container Airflow.
# Jalankan: docker compose up -d   |   Matikan: docker compose down

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  image: fitzone-airflow:2.10.5
  env_file: .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${PG_ADMIN_USER}:${PG_ADMIN_PASSWORD}@postgres:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Jakarta
    AIRFLOW__CORE__PARALLELISM: 4
    AIRFLOW__WEBSERVER__WORKERS: 2
    AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: 60
    PYTHONPATH: /opt/airflow
    PROJECT_ROOT: /opt/airflow
    DW_HOST: postgres
    DW_PORT: 5432
    DATA_LAKE_DIR: /opt/airflow/data_lake
    SOURCE_DIR: /opt/airflow/data/source
  volumes:
    - ./dags:/opt/airflow/dags
    - ./etl:/opt/airflow/etl
    - ./sql:/opt/airflow/sql
    - ./data:/opt/airflow/data
    - ./data_lake:/opt/airflow/data_lake
    - ./logs:/opt/airflow/logs
  user: "50000:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    container_name: fitzone_postgres
    env_file: .env
    environment:
      POSTGRES_USER: ${PG_ADMIN_USER}
      POSTGRES_PASSWORD: ${PG_ADMIN_PASSWORD}
      POSTGRES_DB: ${DW_NAME}
      TZ: Asia/Jakarta
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
      - ./sql:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_ADMIN_USER} -d ${DW_NAME}"]
      interval: 10s
      retries: 5
    restart: unless-stopped
    mem_limit: 768m

  airflow-init:
    <<: *airflow-common
    container_name: fitzone_airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username "$${AIRFLOW_ADMIN_USER}" \
          --password "$${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Admin --lastname FitZone \
          --role Admin --email admin@fitzone.local || true
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: fitzone_airflow_web
    command: webserver
    ports:
      - "8090:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      retries: 5
    restart: unless-stopped
    mem_limit: 1536m
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: fitzone_airflow_scheduler
    command: scheduler
    restart: unless-stopped
    mem_limit: 1536m
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  pgdata:
